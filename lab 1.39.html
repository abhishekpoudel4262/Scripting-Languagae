<!DOCTYPE html>
<html>

<head>
    <title>Form Validation</title>

    <style>
        body {
            font-family: Arial;
        }

        form {
            width: 400px;
            margin: 20px auto;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0 12px;
            box-sizing: border-box;
        }

        input[type="radio"] {
            width: auto;
        }

        button {
            padding: 10px 20px;
        }

        #message {
            color: red;
        }
    </style>
</head>

<body>

<h2 align="center">Registration Form</h2>

<form onsubmit="return validateForm()">

    Name:
    <input type="text" id="name">

    Address:
    <input type="text" id="address">

    Username:
    <input type="text" id="username">

    Email:
    <input type="text" id="email">

    Password:
    <input type="password" id="password">

    Website:
    <input type="text" id="website">

    Phone:
    <input type="text" id="phone">

    Gender:
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female

    <br><br>

    Course:
    <select id="course">
        <option value="">Select Course</option>
        <option value="BCA">BCA</option>
        <option value="BIM">BIM</option>
        <option value="BBS">BBS</option>
        <option value="CSIT">CSIT</option>
    </select>

    <button type="submit">Submit</button>

    <p id="message"></p>

</form>

<script>

function validateForm() {

    var name = document.getElementById("name").value;
    var address = document.getElementById("address").value;
    var username = document.getElementById("username").value;
    var email = document.getElementById("email").value;
    var password = document.getElementById("password").value;
    var phone = document.getElementById("phone").value;
    var course = document.getElementById("course").value;

    // b. Name validation
    if (name == "" || /\d/.test(name)) {
        alert("Enter a valid name.");
        return false;
    }

    // c. Username validation
    if (username == "" || !/^[a-zA-Z0-9_]+$/.test(username)) {
        alert("Username cannot contain spaces or special characters.");
        return false;
    }

    // f. Address validation
    if (address == "") {
        alert("Address cannot be empty.");
        return false;
    }

    // g. Email validation
    if (email == "" || !email.includes("@")) {
        alert("Enter a valid email.");
        return false;
    }

    // h. Password validation
    if (password == "" ||
        password.length < 8 ||
        !/[0-9]/.test(password) ||
        !/[A-Z]/.test(password) ||
        !/[a-z]/.test(password) ||
        !/[!@#$%^&*_]/.test(password)) {

        alert("Password must have 8 characters, a digit, uppercase, lowercase and special character.");
        return false;
    }

    // d. Phone validation
    if (!/^(98|97|96)[0-9]+$/.test(phone)) {
        alert("Phone must contain only numbers and start with 98, 97 or 96.");
        return false;
    }

    // e. Gender validation
    var gender = document.querySelector('input[name="gender"]:checked');

    if (!gender) {
        alert("Please select a gender.");
        return false;
    }

    // i. Course validation
    if (course == "") {
        alert("Please select a course.");
        return false;
    }

    alert("Form submitted successfully!");
    return true;
}

</script>

</body>
</html>
