<!DOCTYPE html>
<html>
<body>

<h3>DOM Manipulation</h3>

<p id="p1">First Paragraph</p>
<p id="p2">Second Paragraph</p>
<p id="p3">Third Paragraph</p>
<p id="p4">Fourth Paragraph</p>

<button onclick="performTasks()">Perform Tasks</button>

<script>
function performTasks() {

    // a. Get the first paragraph using tag name
    var first = document.querySelector("p");
    console.log("First paragraph:", first.textContent);

    // b. Get each paragraph using its ID
    var p1 = document.querySelector("#p1");
    var p2 = document.querySelector("#p2");
    var p3 = document.querySelector("#p3");
    var p4 = document.querySelector("#p4");

    // c. Get all paragraphs as a NodeList
    var paragraphs = document.querySelectorAll("p");

    // d. Loop through NodeList and get text content
    for (var i = 0; i < paragraphs.length; i++) {
        console.log(paragraphs[i].textContent);
    }

    // e. Set text content of fourth paragraph
    p4.textContent = "Fourth Paragraph";

    // f. Set ID and class attributes
    p1.setAttribute("id", "first");
    p2.id = "second";
    p3.setAttribute("class", "para3");
    p4.className = "para4";

    // g. Change style using JavaScript
    for (var i = 0; i < paragraphs.length; i++) {
        paragraphs[i].style.backgroundColor = "lightblue";
        paragraphs[i].style.border = "2px solid black";
        paragraphs[i].style.fontSize = "20px";
        paragraphs[i].style.fontFamily = "Arial";
    }

    // h. Give first and third green, second and fourth red
    for (var i = 0; i < paragraphs.length; i++) {
        if (i === 0 || i === 2)
            paragraphs[i].style.color = "green";
        else
            paragraphs[i].style.color = "red";
    }

    // i. Set text content, ID and class to each paragraph
    paragraphs[0].textContent = "First Paragraph";
    paragraphs[0].id = "firstPara";
    paragraphs[0].className = "paragraph";

    paragraphs[1].textContent = "Second Paragraph";
    paragraphs[1].id = "secondPara";
    paragraphs[1].className = "paragraph";

    paragraphs[2].textContent = "Third Paragraph";
    paragraphs[2].id = "thirdPara";
    paragraphs[2].className = "paragraph";

    paragraphs[3].textContent = "Fourth Paragraph";
    paragraphs[3].id = "fourthPara";
    paragraphs[3].className = "paragraph";
}
</script>

</body>
</html>
