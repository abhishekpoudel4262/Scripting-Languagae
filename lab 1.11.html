<!DOCTYPE html>
<html>
<body>

<h2>Find Smallest Number</h2>

<label>Enter n:</label>
<input type="number" id="n">
<br><br>

<label>Enter integers:</label>
<input type="text" id="numbers" placeholder="Example: 10,20,30">
<br><br>

<button onclick="findSmallest()">Find Smallest</button>

<h3 id="result"></h3>

<script>
function findSmallest() {
    let n = parseInt(document.getElementById("n").value);
    let arr = document.getElementById("numbers").value.split(",").map(Number);

    if (arr.length != n) {
        document.getElementById("result").innerHTML = "Enter exactly " + n + " numbers";
        return;
    }

    let smallest = arr[0];

    for (let i = 1; i < arr.length; i++) {
        if (arr[i] < smallest)
            smallest = arr[i];
    }

    document.getElementById("result").innerHTML =
        "Smallest number: " + smallest;
}
</script>

</body>
</html>
