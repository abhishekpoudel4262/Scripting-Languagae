```html
<!DOCTYPE html>
<html>

<head>
  <style>
    table, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 8px;
      text-align: center;
    }
  </style>
</head>

<body>

<h3>50 Countries - 6 per Row</h3>

<div id="output"></div>

<script>

var countryList = [
  "Nepal", "USA", "Brazil", "Italy", "South Korea",
  "Thailand", "Spain", "Mexico", "Egypt", "Norway"
];

var countries = [];

// Create 50 countries using the given list
for (var i = 0; i < 50; i++) {
  countries.push(countryList[i % countryList.length]);
}

// Create the table
var table = "<table>";

for (var row = 0; row < countries.length; row += 6) {

  table += "<tr>";

  for (var col = row; col < row + 6 && col < countries.length; col++) {
    table += "<td>" + countries[col] + "</td>";
  }

  table += "</tr>";
}

table += "</table>";

document.getElementById("output").innerHTML = table;

</script>

</body>
</html>
