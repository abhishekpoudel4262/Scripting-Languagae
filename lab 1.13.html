<!DOCTYPE html>
<html>
<body>

<h3>Join Array Elements</h3>

<input type="text" id="inp" placeholder="e.g. Star, Moon">
<button onclick="joinArray()">Join</button>

<p id="out"></p>

<script>
function joinArray() {
    var input = document.getElementById("inp").value;
    var arr = input.split(",");

    for (var i = 0; i < arr.length; i++)
        arr[i] = arr[i].trim();

    document.getElementById("out").innerHTML =
        "Normal join: " + arr.join("") + "<br>" +
        "Join with comma: " + arr.join(", ") + "<br>" +
        "Join with plus: " + arr.join(" + ");
}
</script>

</body>
</html>
